services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: libros
      POSTGRES_USER: libros
      POSTGRES_PASSWORD: libros
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libros -d libros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://libros:libros@postgres:5432/libros?schema=public
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      APP_URL: ${APP_URL:-http://localhost:4200}
      INVITATION_SIGNING_SECRET: ${INVITATION_SIGNING_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npm run start:dev"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/v1/questionnaire-sessions').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run start -- --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  frontend-node-modules:
  api-node-modules:
