name: E2E producción (diario)

on:
  schedule:
    # 1 vez por día (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: E2E milibrosorpresa.com
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
          API_URL: ${{ secrets.E2E_API_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_FULL_NAME: ${{ secrets.E2E_FULL_NAME }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: npx playwright test
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
