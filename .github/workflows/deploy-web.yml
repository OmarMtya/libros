name: CI/CD — Web (Firebase Hosting)

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy-web:
    name: Build y deploy a Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload source maps to Sentry
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mi-libro-sorpresa
          SENTRY_PROJECT: javascript-angular
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is required to upload source maps" >&2
            exit 1
          fi
          npx @sentry/cli@latest sourcemaps inject dist/frontend/browser
          npx @sentry/cli@latest sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" dist/frontend/browser
          find dist/frontend/browser -name '*.map' -delete

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project milibrosorpresa --token ${{ secrets.FIREBASE_TOKEN }}
