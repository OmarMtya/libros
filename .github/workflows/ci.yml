name: CI — API & Web

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'test/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'Dockerfile.prod'
      - '.dockerignore'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'

jobs:
  lockfiles:
    name: Lockfiles (compatibles con Linux/CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar dependencias opcionales en lockfiles
        run: |
          for f in package-lock.json frontend/package-lock.json; do
            for p in node_modules/@emnapi/core node_modules/@emnapi/runtime; do
              if ! grep -q "\"$p\"" "$f"; then
                echo "::error file=$f::$p falta en el lockfile (probablemente se regeneró en Windows)."
                echo "::error file=$f::Regenera los lockfiles en Linux con: powershell -ExecutionPolicy Bypass -File scripts/update-lockfiles.ps1 (requiere Docker)."
                exit 1
              fi
            done
          done
          echo "Lockfiles OK"

  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run --exclude 'test/**/*.integration.test.ts'
      - name: Build
        run: npm run build

  web:
    name: Web (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: npm run build
