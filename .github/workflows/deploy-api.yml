name: CI/CD — API

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.prod'
      - '.dockerignore'
      - 'book-classification-prompt.md'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push y deploy en VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        run: |
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "git_short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/omarmtya/libros/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          cache-from: type=gha,scope=libros-api
          cache-to: type=gha,mode=max,scope=libros-api
          tags: |
            ghcr.io/omarmtya/libros/api:latest
            ${{ steps.meta.outputs.image_ref }}

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ steps.meta.outputs.image_ref }}"

            retry() {
              local attempts="$1"
              local delay="$2"
              shift 2

              local try=1
              until "$@"; do
                if [ "$try" -ge "$attempts" ]; then
                  return 1
                fi

                echo "Attempt $try failed. Retrying in ${delay}s..."
                sleep "$delay"
                try=$((try + 1))
              done
            }

            retry 3 5 sh -c 'echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u omarmtya --password-stdin'
            mkdir -p /app/updates/bundles

            docker system df || true
            docker image prune -f || true

            if ! retry 3 10 docker pull "$IMAGE"; then
              echo "Initial image pull failed. Removing old API images..."
              python3 -c "import subprocess; repo='ghcr.io/omarmtya/libros/api'; result=subprocess.run(['docker','images',repo,'--format','{{.Repository}}:{{.Tag}} {{.ID}}'], capture_output=True, text=True, check=True); seen_ids=set(); [subprocess.run(['docker','rmi', ref], check=False) for ref, image_id in (line.split() for line in result.stdout.splitlines() if line.strip()) if not (image_id in seen_ids or seen_ids.add(image_id))]"
              retry 3 10 docker pull "$IMAGE"
            fi

            docker stop libros-api || true
            docker rm libros-api || true
            docker run -d \
              --name libros-api \
              --restart unless-stopped \
              --env-file /opt/libros-api/.env \
              -p 3002:3000 \
              "$IMAGE"

            python3 -c "import subprocess; repo='ghcr.io/omarmtya/libros/api'; keep_count=3; current_image_id=subprocess.run(['docker','inspect','-f','{{.Image}}','libros-api'], capture_output=True, text=True, check=False).stdout.strip(); result=subprocess.run(['docker','images',repo,'--format','{{.Repository}}:{{.Tag}} {{.ID}}'], capture_output=True, text=True, check=True); entries=[]; seen_ids=set(); [entries.append((ref, image_id)) for ref, image_id in (line.split() for line in result.stdout.splitlines() if line.strip()) if not (image_id in seen_ids or seen_ids.add(image_id))]; keep_ids={image_id for _, image_id in entries[:keep_count]}; current_image_id and keep_ids.add(current_image_id); [subprocess.run(['docker','rmi', ref], check=False) for ref, image_id in entries if image_id not in keep_ids]"

            docker image prune -f || true
