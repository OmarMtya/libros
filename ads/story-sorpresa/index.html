<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Libro Sorpresa · Anuncio 9:16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #132a3a;
      --ink-soft: #21465e;
      --mist: #b8cfe5;
      --coral: #dd5d46;
      --coral-deep: #bd4937;
      --marker: #f2be45;
      --paper: #f5f7f8;
      --graphite: #1e2933;
      --border: #cad7df;
      --muted: #c6d3de;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1620;
      font-family: 'Instrument Sans', Arial, sans-serif;
    }

    .story {
      position: relative;
      width: 1080px;
      height: 1920px;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--ink);
      color: #fff;
      transform-origin: center center;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(19, 42, 58, 0.94) 0%,
        rgba(19, 42, 58, 0.74) 22%,
        rgba(19, 42, 58, 0.46) 42%,
        rgba(19, 42, 58, 0.56) 60%,
        rgba(19, 42, 58, 0.9) 78%,
        #132a3a 100%
      );
    }

    .content {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 270px 100px 330px;
    }

    .wordmark {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 60px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #fff;
    }

    .wordmark .coral-block {
      display: inline-block;
      background: var(--coral);
      color: #fff;
      padding: 6px 14px 8px;
      border-radius: 2px;
    }

    .headline {
      max-width: 880px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 104px;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.045em;
      color: #fff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.12), 0 6px 28px rgba(10, 20, 28, 0.35);
    }

    .headline .accent {
      position: relative;
      white-space: nowrap;
    }

    .headline .accent::after {
      content: '';
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 0.03em;
      height: 2px;
      background: var(--coral);
    }

    .secondary {
      margin-top: 56px;
      max-width: 620px;
      font-family: 'Instrument Sans', Arial, sans-serif;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--muted);
    }

  </style>
</head>
<body>
  <main class="story" id="story" aria-label="Anuncio de Mi Libro Sorpresa">
    <img
      class="photo"
      src="https://images.pexels.com/photos/34255056/pexels-photo-34255056.jpeg?auto=compress&cs=tinysrgb&w=1600"
      alt=""
      aria-hidden="true">
    <div class="veil" aria-hidden="true"></div>
    <div class="content">
      <p class="wordmark">Mi Libro <span class="coral-block">Sorpresa</span></p>
      <div class="textblock">
        <h1 class="headline">
          ¿Y si tu próximo<br>
          libro fuera<br>
          una <span class="accent">sorpresa</span>?
        </h1>
        <p class="secondary">Elegimos el libro según tus gustos y cómo lees.</p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById('story');
      function fit() {
        var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920, 1);
        canvas.style.transform = 'scale(' + scale + ')';
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
