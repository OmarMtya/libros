<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 libros para iniciar o retomar la lectura sin sufrirla &middot; Portada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #132a3a;
      --ink-deep: #07131d;
      --coral: #dd5d46;
      --marker: #f2be45;
      --paper: #f5f0e8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--paper);
      font-family: 'Instrument Sans', Arial, sans-serif;
    }

    .cover-slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      flex-shrink: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      transform-origin: center center;
    }

    .photo, .veil, .grain { position: absolute; inset: 0; width: 100%; height: 100%; }
    .photo { object-fit: cover; object-position: center center; filter: brightness(1.04) saturate(0.9); }
    .veil {
      background:
        linear-gradient(180deg, rgba(245, 240, 232, 0.18) 0%, rgba(245, 240, 232, 0.02) 46%, rgba(7, 19, 29, 0.24) 100%),
        linear-gradient(90deg, rgba(245, 240, 232, 0.25) 0%, rgba(245, 240, 232, 0) 58%, rgba(7, 19, 29, 0.12) 100%);
    }
    .grain {
      background-image: radial-gradient(rgba(19, 42, 58, 0.18) 0.7px, transparent 0.7px);
      background-size: 9px 9px;
      opacity: 0.08;
      pointer-events: none;
    }
    .content { position: relative; z-index: 2; height: 100%; padding: 62px 72px 52px; }
    .topline { display: flex; align-items: center; justify-content: center; }
    .brand {
      color: var(--ink);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.95;
    }
    .brand span { display: inline-block; padding: 4px 10px 6px; background: var(--coral); }
    .headline-block {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 830px;
      padding: 46px 52px 50px;
      color: var(--ink);
      background: rgba(245, 240, 232, 0.94);
      border-top: 12px solid var(--coral);
      box-shadow: 0 24px 70px rgba(7, 19, 29, 0.2);
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 24px;
      padding: 9px 13px 8px;
      color: var(--ink);
      background: var(--marker);
      font-family: 'IBM Plex Mono', Consolas, monospace;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 790px;
      color: var(--ink);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 102px;
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 0.86;
      text-transform: uppercase;
    }
    h1 .highlight { display: inline-block; padding: 0 12px 6px; background: var(--marker); }
    @media (prefers-reduced-motion: reduce) { .cover-slide { transform: none !important; } }
  </style>
</head>
<body>
  <main class="cover-slide" id="cover-slide" aria-label="Portada del carrusel 5 libros para iniciar o retomar la lectura sin sufrirla">
    <img class="photo" src="https://images.pexels.com/photos/2912515/pexels-photo-2912515.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1600" alt="Mujer leyendo un libro en un balcon con luz natural">
    <div class="veil" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="content">
      <header class="topline"><p class="brand">Mi Libro <span>Sorpresa</span></p></header>
      <section class="headline-block">
        <p class="eyebrow">Para lectores curiosos</p>
        <h1>5 libros para<br>iniciar o retomar<br>la lectura<br><span class="highlight">sin sufrirla</span></h1>
      </section>
    </div>
  </main>
  <script>
    (function () {
      var canvas = document.getElementById('cover-slide');
      function fit() { canvas.style.transform = 'scale(' + Math.min(window.innerWidth / 1080, window.innerHeight / 1350, 1) + ')'; }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
